<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gestor de tareas personal — simple, rápido y sin distracciones" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icono.png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Task Manager</title>
</head>
<body>

  <!-- ── PANTALLA DE AUTH ─────────────────────────────── -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1 class="app-title">Task<span>.</span></h1>
      <p class="app-subtitle">Tu gestor de tareas personal</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="showTab('login')">Iniciar sesión</button>
        <button class="auth-tab" id="tabRegister" onclick="showTab('register')">Registrarse</button>
      </div>

      <!-- Login -->
      <div id="loginForm">
        <input type="email" id="loginEmail" class="input-field" placeholder="Email" autocomplete="email" />
        <input type="password" id="loginPassword" class="input-field" placeholder="Contraseña" />
        <p id="loginError" class="auth-error"></p>
        <button class="btn-add" onclick="login()">Entrar</button>
      </div>

      <!-- Register -->
      <div id="registerForm" style="display:none">
        <input type="text" id="regUsername" class="input-field" placeholder="Usuario" />
        <input type="email" id="regEmail" class="input-field" placeholder="Email" />
        <input type="password" id="regPassword" class="input-field" placeholder="Contraseña (mín. 6 caracteres)" />
        <p id="registerError" class="auth-error"></p>
        <button class="btn-add" onclick="register()">Crear cuenta</button>
      </div>
    </div>
  </div>

  <!-- ── APP PRINCIPAL ────────────────────────────────── -->
  <div id="appScreen" class="app-wrapper" style="display:none">

    <header class="app-header">
      <div class="app-header__top">
        <h1 class="app-title">Task<span>.</span></h1>
        <span class="task-counter" id="taskCounter">Cargando...</span>
      </div>
      <div class="app-header__bottom">
        <p class="app-subtitle">Hola, <strong id="usernameDisplay"></strong> 👋</p>
        <button class="btn-logout" onclick="logout()">Salir</button>
      </div>
    </header>

    <div class="input-card">
      <input type="text" id="taskInput" class="input-field" placeholder="¿Qué tenés que hacer?" autocomplete="off" aria-label="Título de la tarea" />
      <textarea id="descriptionInput" class="input-field" placeholder="Descripción (opcional)..." rows="2" aria-label="Descripción"></textarea>
      <button id="addTaskBtn" class="btn-add">+ Agregar tarea</button>
    </div>

    <p class="section-label">Tus tareas</p>

    <div id="emptyState" class="empty-state" style="display:none">
      <span class="empty-state__icon">✓</span>
      <p class="empty-state__text">Todo en orden. ¡Agregá una tarea!</p>
    </div>

    <ul class="task-list" id="taskList" aria-label="Lista de tareas"></ul>

    <footer class="app-footer">
      <a href="trash.html" class="btn-trash-link" aria-label="Ir a papelera">🗑 Papelera</a>
    </footer>

  </div>

  <a class="banner-autor" href="https://www.linkedin.com/in/celina-moscardi-bevacqua" target="_blank" rel="noopener noreferrer" aria-label="Built by Celina M.">
    <span class="banner-autor__icon">✦</span>
    Built by <strong>Celina M.</strong>
  </a>

  <script src="main.js"></script>
</body>
</html>
